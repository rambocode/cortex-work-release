name: Deploy to GitHub Pages

# 推送到 main 即构建静态站点并发布到 GitHub Pages。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 授予 Pages 部署所需权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新提交取消进行中的旧部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 子路径部署：Pages 地址为 https://rambocode.github.io/cortex-work-release/
      NEXT_BASE_PATH: /cortex-work-release
      NEXT_PUBLIC_SITE_URL: https://rambocode.github.io/cortex-work-release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 本仓库未提交 lockfile，且 catalog: 依赖由根 pnpm-workspace.yaml 解析。
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build (next export)
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
